<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Profile</title>
</head>
<body>
<div class="app-container">
    <header>
        <h1>User Profile</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="add.html">Phrases</a>
            <a href="favorites.html">Favorites</a>
            <a href="details.html">Details</a>
            <a href="quiz.html">Quiz</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>
<main>
    <div id="profileInfo">
        <h2>Hello, User!</h2>
        <p id="username">Username: <span></span></p>

        <h3>Preferences</h3>
        <form id="profileForm">
            <label for="preferredLanguage">Preferred Language:</label>
            <select id="preferredLanguage" name="preferredLanguage">
                <option value="en-US">English</option>
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="de-DE">German</option>
            </select>

            <label for="favoriteCategory">Favorite Category:</label>
            <select id="favoriteCategory" name="favoriteCategory">
                <option value="Greetings">Greetings</option>
                <option value="Travel">Travel</option>
            </select>

            <label for="theme">Theme:</label>
            <select id="theme" name="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>

            <button type="submit">Save Preferences</button>
        </form>
    </div>
    <div>
        <h3>Stats</h3>
        <ul>
            <li>Phrases Learned: <span id="phrasesLearned">0</span></li>
            <li>Favorite Phrases: <span id="favoritePhrases">0</span></li>
            <li>Quizzes Taken: <span id="quizzesTaken">0</span></li>
        </ul>
    </div>
</main>
<footer>
    <p>Language Phrasing App</p>   
</footer>
</body>
</html>
