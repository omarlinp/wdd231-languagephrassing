<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Add Phrase</title>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Add a New Phrase</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="add.html">Phrases</a>
            <a href="favorites.html">Favorites</a>
            <a href="details.html">Details</a>
            <a href="quiz.html">Quiz</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>
<main>
    <form id="addPhraseForm">
        <div class="control-group">
            <label for="original">Original Phrase:</label>
            <input type="text" id="original" required>
        </div>
        <div class="control-group">
            <label for="translation">Translation:</label>
            <input type="text" id="translation" required>
        </div>
        <div class="control-group">
            <label for="category">Category:</label>
            <select id="category">
                <option value="Greetings">Greetings</option>
                <option value="Travel">Travel</option>
                <option value="Food">Food</option>
                <option value="Shopping">Shopping</option>
            </select>
        </div>
        <div class="control-group">
            <label for="language">Language (for pronunciation):</label>
            <select id="language">
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="de-DE">German</option>
            </select>
        </div>
        <button type="submit">Add Phrase</button>
    </form>
</main>
<footer>
    <p>Language Phrasing App</p>
</footer>
</div>
<script type="module" src="javascript/add.js"></script>
</body>
</html>
