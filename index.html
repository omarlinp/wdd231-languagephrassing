<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Phrasing App</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
<div class="app-container">
<header>
<h1>Language Phrasing App</h1>
<p class="subtitle">Learn phrases in different languages</p>
<nav>
  <a href="index.html">Home</a>
  <a href="add.html">Phrases</a>
  <a href="favorites.html">Favorites</a>
  <a href="details.html">Details</a>
  <a href="quiz.html">Quiz</a>
  <a href="profile.html">Profile</a>
</nav>
</header>
<main>
<label for="category">Choose a category:</label>
<select id="category" onchange="loadPhrases()">
  <option value="Greetings">Greetings</option>
  <option value="Travel">Travel</option>
</select>

<label for="language">Choose a language:</label>
<select id="language">
  <option value="es-ES">Spanish</option>
  <option value="fr-FR">French</option>
  <option value="de-DE">German</option>
</select>

<div id="phraseList"></div>

<div class="details" id="details">
  <h3 id="original"></h3>
  <p id="translation"></p>
  <button onclick="speak()" aria-label="Play pronunciation">🔊 Pronounce</button>
</div>
</main>
<footer>
  <p>Language Phrasing App</p>
</footer>
</div>
<script>
const phrases = [
  {
    category: "Greetings",
    original: "Good morning",
    translation: "Buenos días",
    language: "es-ES"
  },
  {
    category: "Greetings",
    original: "How are you?",
    translation: "¿Cómo estás?",
    language: "es-ES"
  },
  {
    category: "Travel",
    original: "Where is the bathroom?",
    translation: "¿Dónde está el baño?",
    language: "es-ES"
  },
  {
    category: "Travel",
    original: "How much does it cost?",
    translation: "¿Cuánto cuesta?",
    language: "es-ES"
  }
];

let selectedPhrase = null;

function loadPhrases() {
  const category = document.getElementById("category").value;
  const list = document.getElementById("phraseList");
  list.innerHTML = "";

  phrases
    .filter(p => p.category === category)
    .forEach(p => {
      const div = document.createElement("div");
      div.className = "phrase";
      div.textContent = `${p.original} → ${p.translation}`;
      div.onclick = () => showDetails(p);
      list.appendChild(div);
    });
}

function showDetails(phrase) {
  selectedPhrase = phrase;
  document.getElementById("original").textContent = phrase.original;
  document.getElementById("translation").textContent = phrase.translation;
  document.getElementById("details").style.display = "block";
}

function speak() {
  if (!selectedPhrase) return;

  const selectedLanguage = document.getElementById("language").value;

  const utterance = new SpeechSynthesisUtterance(
    selectedPhrase.translation
  );
  utterance.lang = selectedLanguage;
  speechSynthesis.speak(utterance);
}

// Load initial phrases
loadPhrases();
</script>

</body>
</html>
