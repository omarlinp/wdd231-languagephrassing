<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Phrasing App</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
<header>
<h1>Language Phrasing App</h1>
<p class="subtitle">Learn phrases in different languages</p>
<nav>
  <a href="index.html">Home</a>
  <a href="add.html">Phrases</a>
  <a href="favorites.html">Favorites</a>
  <a href="details.html">Details</a>
  <a href="quiz.html">Quiz</a>
  <a href="profile.html">Profile</a>
</nav>
</header>
<main>
<div class="filters">
  <div class="filter">
<label for="category">Choose a category:</label>
<select id="category" onchange="loadPhrases()">
  <option value="Greetings">Greetings</option>
  <option value="Travel">Travel</option>
  <option value="Food">Food</option>
  <option value="Emergency">Emergency</option>
</select>
</div>

<div class="filter">
<label for="language">Choose a language:</label>
<select id="language">
  <option value="es-ES">Spanish</option>
  <option value="fr-FR">French</option>
  <option value="de-DE">German</option>
</select>
</div>

</div>

<div id="phraseList"></div>

<div class="details" id="details">
  <h3 id="original">Phrase</h3>
  <p id="translation">Translation</p>
  <button onclick="speak()" aria-label="Play pronunciation">🔊 Pronounce</button>
  <button onclick="addToFavorites(selectedPhrase)" aria-label="Add to favorites">⭐ Add to Favorites</button>
</div>
</main>
<footer>
  <p>Language Phrasing App</p>
</footer>

<script type="module" src="javascript/index.js">
</script>
<script src="javascript/theme.js"></script>
</body>
</html>
